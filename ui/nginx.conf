# cinc-dashboard-ui nginx configuration
# Serves the improved cinc-dashboard WebUI at / and proxies the live data API
# (cinc-dashboard-api FastAPI container) so the dashboard shows real converge
# data from the .27 cinc_collector.
#
# FIX: port 80 is the single documented entry point for the dashboard.
# The ui service binds "80:80" and this listener holds it.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index latest-run-card.html index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /runs {
        proxy_pass http://api:8000/runs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
