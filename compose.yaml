# cinc-dashboard — unified single-app stack.
services:
  postgres:
    image: postgres:17-alpine
    container_name: cinc-dashboard-postgres
    env_file: [.env]
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    networks: [cinc-net]

  app:
    build: ./app
    image: ${CINC_REGISTRY:-chunkylover59}/cinc-dashboard:${CINC_IMAGE_TAG:-latest}
    container_name: cinc-dashboard-app
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      EVENT_DIR: /data/raw-events
      UI_DIR: /app/ui
    ports:
      - "8080:8080"
    volumes:
      - ./data/raw-events:/data/raw-events
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [cinc-net]

networks:
  cinc-net:
    driver: bridge

volumes:
  postgres-data:
